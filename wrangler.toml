name = "woclub"
main = "src/entry.js"
compatibility_date = "2026-08-24"
workers_dev = true

[assets]
directory = "./public"

[observability]
enabled = true

# One KV namespace holds both aggregate usage counters (count:/caller:/builder:)
# and the sparse voxel world (w:c:<cx>:<cz> chunks, w:meta, w:ov). Provision a
# dedicated namespace later if write volume warrants it.
[[kv_namespaces]]
binding = "METRICS"
id = "048fa0e573bb4d99862b73ec1ab49fea"

[vars]
WORLD_WRITE_MODE = "paused"

[[durable_objects.bindings]]
name = "WORLD_COORDINATOR"
class_name = "WorldCoordinator"

[[migrations]]
tag = "world-coordinator-v1"
new_sqlite_classes = ["WorldCoordinator"]
